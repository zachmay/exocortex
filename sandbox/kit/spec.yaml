schemaVersion: "1"
kind: sandbox
name: obsidian
sandbox:
  image: exocortex-sbx:latest
  aiFilename: CLAUDE.md
  entrypoint:
    run: [runuser, -u, agent, --, claude, --dangerously-skip-permissions]
commands:
  install:
    - command: ln -sfn "$WORKSPACE_DIR" /vault
    - command: mkdir -p /scratch && chown agent:agent /scratch
    # CLAUDE.md/settings.json/TOOLCHAIN.md are baked into the image at build
    # time (see sandbox/Dockerfile) rather than copied here — they're
    # per-image, not per-sandbox-instance, state.
    # Register the consolidated host-bridge MCP at user scope so every fresh
    # sandbox sees it. One server (exocortex-host-bridge, port 8765) serves all
    # host capabilities as plugins (gh, acli, calendar, whisper). Auth uses a
    # stateless signed token, injected via sbx's custom-secret mechanism
    # (host-bridge/run.sh registers it with `sbx secret set-custom`): the
    # sandbox only ever sees the HOST_BRIDGE_TOKEN env var's placeholder value;
    # sbx's egress proxy swaps in the real token in-flight on outbound requests
    # to localhost, so the real token never enters the sandbox filesystem or
    # config. An absent secret registration means the placeholder itself gets
    # sent, which the host-bridge rejects with a clean 401 — run host-bridge's
    # run.sh (which mints + registers the token) before creating the sandbox.
    # Keyed on host.docker.internal:8765, matching the localhost:8765 allow
    # rule below.
    # HOST_BRIDGE_TOKEN is read here (root context, where sbx injects secret
    # env vars) and re-forwarded explicitly via `env` — runuser doesn't
    # preserve the environment by default, so this can't just rely on
    # inheritance.
    - command: >-
        runuser -u agent -- env HOST_BRIDGE_TOKEN="$HOST_BRIDGE_TOKEN" bash -c 'claude mcp add --scope user --transport http host-bridge http://host.docker.internal:8765/mcp --header "Authorization: Bearer ${HOST_BRIDGE_TOKEN}"'
caps:
  network:
    # Deps are baked into the image — no registry access needed at runtime.
    # This sandbox runs Claude Code remote-controlled from claude.ai. Network
    # is locked down to anthropic/claude domains, the host bridges, and a
    # curated read-only safelist of reputable skill data sources (added below).
    # Everything else that sbx's global default-* policies open is explicitly
    # denied further down.
    allow:
      - claude.ai
      - "**.claude.ai"
      - claude.com
      - api.anthropic.com
      - platform.claude.com
      - statsig.anthropic.com
      # Host bridge. KEY FINDING: sbx's egress proxy classifies the resolved host
      # address as `localhost`, so allow rules MUST be keyed on `localhost:<port>` —
      # a bare `host.docker.internal` entry is a silent no-op. Bare `localhost`
      # works but opens ALL host ports; scope per-port for least privilege.
      #
      # exocortex-host-bridge (host-bridge/ in this repo): one host-native MCP server
      # serving all host capabilities as plugins — gh + acli (the host's
      # authenticated CLIs), calendar (icalBuddy/EventKit), whisper (mlx_whisper).
      # Native macOS process, NOT a container: EventKit, Metal, and the host CLI
      # auth only exist on the host. Replaces the former per-capability bridges on
      # 8010/8020/8099.
      - localhost:8765
      # --- Curated read-only skill data sources -------------------------------
      # Derived from a per-skill network audit (2026-06-12): every entry here is
      # a reputable, READ-ONLY API/site that a vault skill fetches from. No
      # write/POST endpoints, no arbitrary-crawl, no exfil sinks. Skills needing
      # open-web crawl (capture-article, web-reading-ingestion, recipe-librarian,
      # open WebSearch research) and the one write-capable service (self-hosted
      # Lidarr) are deliberately handled in out-of-sandbox sessions instead.
      # `**.` matches subdomains only; apex hosts are listed explicitly.
      # Reference knowledge (general lookups, People Librarian)
      - "**.wikipedia.org"
      - "**.wikimedia.org"
      - wikidata.org
      # cube-manager — Scryfall MTG card data
      - api.scryfall.com
      - cards.scryfall.io
      # eurorack-manager — ModularGrid module specs
      - "**.modulargrid.net"
      # film-librarian — TMDB metadata + poster images
      - api.themoviedb.org
      - image.tmdb.org
      - www.themoviedb.org
      # craigslist-crawler — classifieds listings
      - "**.craigslist.org"
      # music metadata (music research)
      - musicbrainz.org
    # Deny everything else the global default-* allow policies open. Deny
    # beats allow, so this neutralizes them for this sandbox while leaving
    # the globals intact for other sandboxes.
    deny:
      # default-ai-services (non-anthropic)
